<section class="about-container py-5">
  <div class="container text-center">
    <!-- Header -->
    <header class="mb-5">
      <h1 class="display-3 fw-bold text-primary">{{ developerInfo.name }}</h1>
      <p class="lead text-secondary">{{ developerInfo.title }}</p>
      <p class="bio-text mx-auto w-75">{{ developerInfo.bio }}</p>
      <div class="row mb-5">
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <div class="social-btns mb-3">
          <!-- <a [href]="socialLinks.linkedin" target="_blank" class="btn btn-outline-primary mx-2">LinkedIn</a> -->
          <a [href]="socialLinks.github" target="_blank" class="btn btn-outline-dark mx-2">GitHub</a>
        </div>
        </div>
      </div>
    </header>
    <!-- Profiles -->

    <!-- Skills Section -->
    <div class="row mb-5">
      <h3 class="mb-4">المهارات التقنية</h3>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <span *ngFor="let skill of skills" class="badge rounded-pill bg-dark p-3">
          {{ skill.name }}
        </span>
      </div>
    </div>



    <!-- Current Project Card -->
    <div class="card shadow-sm mb-5 mx-auto w-75">
      <div class="card-body">
        <h4 class="card-title text-danger">المشروع الحالي: {{ currentProject.name }}</h4>
        <ul class="list-unstyled mt-3">
          <li *ngFor="let feature of currentProject.features" class="mb-2">
            <i class="fas fa-check-circle text-success me-2"></i> {{ feature }}
          </li>
        </ul>
      </div>
    </div>



  </div>
</section>
