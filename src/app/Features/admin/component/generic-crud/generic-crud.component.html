<div class="crud-container p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">{{ title }}</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#crudModal">
      إضافة جديد
    </button>
  </div>

  <div class="table-responsive bg-white p-3 rounded shadow-sm">
    <table class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th *ngFor="let col of columns">{{ col.header }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of data">
          <td *ngFor="let col of columns">{{ row[col.field] }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal fade" id="crudModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">إضافة جديدة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <app-dynamic-form [config]="formConfig" (submitForm)="onSave($event)"></app-dynamic-form>
        </div>
      </div>
    </div>
  </div>
</div>
