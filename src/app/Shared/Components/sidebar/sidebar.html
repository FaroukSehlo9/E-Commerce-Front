<div class="d-flex flex-column flex-shrink-0 p-3 bg-light border-end" style="height: 100vh;">
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item mb-2" *ngFor="let item of menuItems">
      <a
        class="nav-link"
        [routerLink]="['/admin', item.path]"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"> {{ item.title }}
      </a>
    </li>
  </ul>

  <hr>
  <div class="small text-muted text-center">الإصدار 1.0.0</div>
</div>
